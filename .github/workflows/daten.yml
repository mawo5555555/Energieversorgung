name: Daten abrufen

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: python scripts/fetch_data.py
      - name: Änderungen speichern
        run: |
          git config user.name "daten-bot"
          git config user.email "daten-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Daten aktualisiert"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
